services:
  tripout-frontend:
    container_name: tripout-frontend
    restart: always
    image: node:20.10.0
    ports:
      - 4000:3035
    environment:
      - PORT=3035
    volumes:
      - ./:/usr/src/tripout-frontend
    working_dir: /usr/src/tripout-frontend
    networks:
      - client-network
      - monorepo-network
    command: bash -c "yarn  && yarn run start"

networks:
  client-network:
    driver: bridge
  monorepo-network:
    external: true
    name: tripagency_monorepo-network