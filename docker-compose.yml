services:
  tripout-frontend:
    container_name: tripout-frontend
    restart: always
    image: node:20.10.0
    ports:
      - 4000:3035
    environment:
      - PORT=3035
    volumes:
      - ./:/usr/src/tripout-frontend
    working_dir: /usr/src/tripout-frontend
    networks:
      - client-network
      - monorepo-network
    command: bash -c "yarn && yarn run build && yarn run start"

  trip-agency:
    container_name: trip-agency
    restart: always
    image: node:20.10.0
    ports:
      - 3030:3027
    environment:
      - PORT_API=3027
      - PORT_BATCH=3008
      - MONGO_DEV=mongodb+srv://alberti:hasanboy0303@cluster0.vhweshu.mongodb.net/Nestar
      - MONGO_PROD=mongodb+srv://alberti:hasanboy0303@cluster0.vhweshu.mongodb.net/Nestar
      - SECRET_TOKEN=739659349639433vxvcnwe536738278333
    volumes:
      - ./:/usr/src/tripout
    working_dir: /usr/src/tripout
    networks:
      - monorepo-network
    command: bash -c "rm -rf dist && npm install && npm run build && npm run start:prod"
  tripout-batch:
    container_name: tripout-batch
    restart: unless-stopped
    image: node:20.10.0
    ports:
      - 4002:3008
    environment:
      - PORT_API=3027
      - PORT_BATCH=3008
      - MONGO_DEV=mongodb+srv://alberti:hasanboy0303@cluster0.vhweshu.mongodb.net/Nestar
      - MONGO_PROD=mongodb+srv://alberti:hasanboy0303@cluster0.vhweshu.mongodb.net/Nestar
      - SECRET_TOKEN=739659349639433vxvcnwe536738278333
    volumes:
      - ./:/usr/src/tripout
    working_dir: /usr/src/tripout
    networks:
      - monorepo-network
    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  client-network:
    driver: bridge
  monorepo-network:
    external: true
    name: tripagency_monorepo-network